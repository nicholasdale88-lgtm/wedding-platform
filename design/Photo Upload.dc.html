<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#f6f0e2}*{box-sizing:border-box}a{color:#55633f}a:hover{color:#33402f}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes kenburns{0%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}</style>
</helmet>
<template id="__bundler_thumbnail"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#3f4c33"></rect><text x="60" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#f3ecd6">S&amp;N</text></svg></template>
<div style="min-height:100vh;background:#f6f0e2;color:#33402f;font-family:'Cormorant Garamond',Georgia,serif">
<div style="max-width:560px;margin:0 auto">

  <section style="position:relative;height:46vh;min-height:330px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;color:#fbf8f2">
    <div style="position:absolute;inset:0;background:url('assets/lookout.jpg') center 45%/cover no-repeat;animation:kenburns 9s ease-out forwards"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,48,32,.1) 0%,rgba(40,48,32,.25) 45%,rgba(47,58,38,.9) 100%)"></div>
    <div style="position:relative;padding:0 28px 30px;display:flex;flex-direction:column;gap:6px">
      <div style="opacity:0;animation:rise 1s ease .2s forwards;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:.32em;text-transform:uppercase">Sophie &amp; Nicholas · 18 November 2027</div>
      <div style="opacity:0;animation:rise 1.2s ease .5s forwards;font-family:'Pinyon Script',cursive;font-size:clamp(46px,13vw,62px);line-height:1">Our photo album</div>
    </div>
  </section>

  <section style="padding:30px 26px 18px;display:flex;flex-direction:column;gap:18px">
    <p style="margin:0;font-size:21px;font-style:italic;line-height:1.45;text-wrap:pretty">{{ greeting }}</p>
    <label style="display:flex;flex-direction:column;gap:6px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#55633f">Your name<input value="{{ by }}" onChange="{{ setBy }}" placeholder="So we know who took them" style="padding:13px 14px;border:1px solid #c6b794;background:#fbf8f2;font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;letter-spacing:0;text-transform:none;color:#33402f"></label>
    <input type="file" accept="image/*" multiple ref="{{ fileRef }}" onChange="{{ pick }}" style="display:none">
    <button onClick="{{ choose }}" style="padding:18px 20px;border:0;background:#33402f;color:#f6f0e2;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;cursor:pointer" style-hover="background:#55633f">{{ chooseLbl }}</button>
    <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}"><div style="font-family:'DM Sans',sans-serif;font-size:14px;color:#8a5a45">{{ err }}</div></sc-if>
    <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ false }}"><div style="font-family:'DM Sans',sans-serif;font-size:14px;color:#55633f">{{ status }}</div></sc-if>
  </section>

  <section style="padding:0 26px 30px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="0">
      <div onClick="{{ it.retry }}" style="position:relative;aspect-ratio:1;overflow:hidden;background:#e6dcc4;cursor:{{ it.cur }}">
        <img src="{{ it.url }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;opacity:{{ it.imgOp }};transition:opacity .4s">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:{{ it.veil }};color:#fbf8f2;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:6px">
          <sc-if value="{{ it.up }}" hint-placeholder-val="{{ false }}"><span style="width:22px;height:22px;border-radius:50%;border:2px solid rgba(251,248,242,.4);border-top-color:#fbf8f2;animation:spin .9s linear infinite"></span></sc-if>
          {{ it.label }}
        </div>
      </div>
    </sc-for>
  </section>

  <footer style="padding:10px 26px 50px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center">
    <div style="display:flex;align-items:center;gap:12px"><div style="width:40px;height:1px;background:#b39563"></div><div style="width:6px;height:6px;background:#b39563;transform:rotate(45deg)"></div><div style="width:40px;height:1px;background:#b39563"></div></div>
    <div style="font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.6;color:#5b6a52;max-width:330px">Photos are saved at full quality to Sophie and Nicholas's private album. Only they can see them. Add as many as you like, any time.</div>
  </footer>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;endpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { by: '', tok: '', items: [], err: '' };
  fileRef = React.createRef();
  ep() { let ep = this.props.endpoint; try { ep = ep || localStorage.getItem('sn-admin-api'); } catch (e) {} return ep || ''; }
  componentDidMount() {
    const tok = new URLSearchParams(window.location.search).get('g') || '';
    let local = null; try { local = JSON.parse(localStorage.getItem('sn-rsvp-admin-v1') || 'null'); } catch (e) {}
    const g = tok && local && (local.guests || []).find(x => x.token === tok);
    let saved = ''; try { saved = localStorage.getItem('sn-photo-name') || ''; } catch (e) {}
    this.setState({ tok, by: g ? g.name : saved });
    const ep = this.ep();
    if (ep && tok && !g) fetch(ep + '?action=guest&g=' + encodeURIComponent(tok)).then(r => r.json()).then(j => { if (j.ok && j.guest && !this.state.by) this.setState({ by: j.guest.name }); }).catch(() => {});
  }
  componentWillUnmount() { this.state.items.forEach(it => URL.revokeObjectURL(it.url)); }
  mark(id, st) { this.setState(s => ({ items: s.items.map(x => x.id === id ? Object.assign({}, x, { st }) : x) })); }
  shrink(file) {
    return new Promise(res => {
      const img = new Image(), u = URL.createObjectURL(file);
      img.onload = () => { const k = Math.min(1, 2400 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => res(b || file), 'image/jpeg', 0.88); };
      img.onerror = () => { URL.revokeObjectURL(u); res(file); };
      img.src = u;
    });
  }
  idb() { return new Promise((res, rej) => { const r = indexedDB.open('sn-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  send(blob, id) {
    const ep = this.ep(), by = this.state.by.trim(), tok = this.state.tok;
    if (!ep) return this.idb().then(db => new Promise((res, rej) => { const tx = db.transaction('p', 'readwrite'); tx.objectStore('p').put({ id, by, token: tok, at: new Date().toISOString(), blob }); tx.oncomplete = () => { try { localStorage.setItem('sn-photos-ping', String(Date.now())); } catch (e) {} res(); }; tx.onerror = () => rej(tx.error); }));
    return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); })
      .then(data => fetch(ep, { method: 'POST', body: JSON.stringify({ action: 'photo', token: tok, by, mime: blob.type || 'image/jpeg', data }) }))
      .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error || 'Upload failed'); });
  }
  run() {
    if (this.running) return; this.running = true;
    const next = () => {
      const it = this.state.items.find(x => x.st === 'wait');
      if (!it) { this.running = false; return; }
      this.mark(it.id, 'up');
      this.shrink(it.f).then(b => this.send(b, it.id)).then(() => this.mark(it.id, 'ok')).catch(() => this.mark(it.id, 'err')).then(next);
    };
    next();
  }
  renderVals() {
    const s = this.state;
    const ok = s.items.filter(x => x.st === 'ok').length, left = s.items.filter(x => x.st === 'wait' || x.st === 'up').length, bad = s.items.filter(x => x.st === 'err').length;
    const first = s.by.trim().split(' ')[0];
    return {
      greeting: (first ? 'Hi ' + first + ', ' : '') + 'thank you for being part of our day. Every photo you took helps us relive it, so please add them here.',
      by: s.by, setBy: e => { this.setState({ by: e.target.value, err: '' }); try { localStorage.setItem('sn-photo-name', e.target.value); } catch (x) {} },
      fileRef: this.fileRef,
      choose: () => { if (!s.by.trim()) return this.setState({ err: 'Please add your name first.' }); this.fileRef.current && this.fileRef.current.click(); },
      chooseLbl: s.items.length ? 'Add more photos' : 'Choose photos',
      pick: e => { const fs = Array.from(e.target.files || []); e.target.value = ''; if (!fs.length) return; const items = fs.map((f, i) => ({ id: Date.now() + '-' + i + '-' + Math.random().toString(36).slice(2, 6), f, url: URL.createObjectURL(f), st: 'wait' })); this.setState(st => ({ items: items.concat(st.items), err: '' }), () => this.run()); },
      hasErr: !!s.err, err: s.err, hasItems: s.items.length > 0,
      status: left ? 'Adding ' + left + (left === 1 ? ' photo' : ' photos') + '… keep this page open' : ok + (ok === 1 ? ' photo' : ' photos') + ' added. Thank you!' + (bad ? ' ' + bad + ' did not go through, tap to retry.' : ''),
      items: s.items.map(it => ({ url: it.url, up: it.st === 'up', label: it.st === 'wait' ? 'Waiting' : it.st === 'up' ? '' : it.st === 'ok' ? 'Added' : 'Tap to retry', veil: it.st === 'ok' ? 'linear-gradient(180deg,transparent 60%,rgba(51,64,47,.75))' : it.st === 'err' ? 'rgba(138,90,69,.7)' : 'rgba(51,64,47,.45)', imgOp: it.st === 'ok' ? 1 : 0.7, cur: it.st === 'err' ? 'pointer' : 'default', retry: () => { if (it.st === 'err') { this.mark(it.id, 'wait'); setTimeout(() => this.run(), 0); } } }))
    };
  }
}
</script>
</body>
</html>
