# Runs on every push: the full suite must be green before anything else (docs/12).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main or staging: it may be mid-deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

permissions:
  contents: write # only used to commit the lockfile on the very first run

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # pnpm comes from Corepack (version pinned in package.json "packageManager").
      - name: Enable pnpm
        run: |
          npm install -g corepack@latest
          corepack enable
          pnpm --version

      # No Node on the dev machine: CI keeps the lockfile up to date and commits any change back.
      - name: Install
        run: |
          pnpm install --no-frozen-lockfile

      - name: Commit lockfile changes
        if: ${{ hashFiles('pnpm-lock.yaml') != '' && github.event_name == 'push' }}
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Update pnpm lockfile (CI)"
            git push
          fi

      - name: No couple-specific content in app code (docs/13)
        run: |
          if grep -rInE 'Sophie|Nicholas|Glenworth|horse' apps/*/src packages/*/src; then
            echo "::error::Couple-specific text found in app code. Move it to seed/ or tenant content."
            exit 1
          fi

      - name: Database changes never lose data
        run: bash scripts/check-migrations.sh

      - name: No secrets committed
        run: |
          if git grep -nIE '(-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{40,}|sk_live_[A-Za-z0-9]{16,}|xox[bap]-[A-Za-z0-9-]{10,})' -- . ':!pnpm-lock.yaml'; then
            echo "::error::Something that looks like a secret is committed. Remove it and roll the key."
            exit 1
          fi

      - name: No known-vulnerable runtime dependencies
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        # No package prefix on output lines, so failing tests show as annotations on the run page.
        run: pnpm -r --reporter-hide-prefix test

      - name: Build the website
        run: |
          pnpm --filter web build
          grep -q "Content-Security-Policy" apps/web/dist/_headers || { echo "::error::Security headers missing from the build"; exit 1; }

      - name: Seed script produces SQL (dummy owner; nothing is deployed)
        run: |
          cd apps/api
          SEED_OWNER_EMAIL=ci@example.com SEED_OWNER_PASSCODE=ci-only-passcode pnpm seed:sql ../../seed/sophie-nicholas.json "$RUNNER_TEMP/seed.sql"
          test "$(wc -l < "$RUNNER_TEMP/seed.sql")" -gt 100

  # Tap-through tests: the app runs here (API with its own throwaway local database, and the website) and a
  # real browser, phone-sized, clicks through what couples and guests do. Never touches the live site.
  e2e:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          npm install -g corepack@latest
          corepack enable

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Install the test browser
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Start the app (local API and database, and the website)
        run: |
          cd apps/api
          pnpm exec wrangler d1 migrations apply DB --local
          nohup pnpm exec wrangler dev --port 8787 --var SESSION_SECRET:e2e-only-secret > "$RUNNER_TEMP/api.log" 2>&1 &
          cd ../web
          nohup pnpm exec vite --port 5173 --strictPort > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:5173/ > /dev/null && curl -s http://localhost:5173/api/site > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:5173/api/site || { echo "::error::The app didn't start"; tail -50 "$RUNNER_TEMP/api.log"; tail -50 "$RUNNER_TEMP/web.log"; exit 1; }

      - name: Tap through it
        run: pnpm --filter e2e e2e

      - name: Logs and report (when something failed)
        if: failure()
        run: |
          # The app's own errors, as notes on the run page.
          grep -iE 'error|exception|fail' "$RUNNER_TEMP/api.log" | tail -15 | while IFS= read -r l; do echo "::warning title=API log::${l:0:400}"; done || true
          grep -iE 'error|fail' "$RUNNER_TEMP/web.log" | tail -5 | while IFS= read -r l; do echo "::warning title=Web log::${l:0:400}"; done || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          npm install -g corepack@latest
          corepack enable

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Deploy to Cloudflare
        run: ./scripts/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
          SEED_OWNER_EMAIL: ${{ secrets.SEED_OWNER_EMAIL }}
          SEED_OWNER_PASSCODE: ${{ secrets.SEED_OWNER_PASSCODE }}
          SUPER_ADMINS: ${{ secrets.SEED_OWNER_EMAIL }}
          MM_USER: ${{ secrets.MM_USER }}
          MM_PASS: ${{ secrets.MM_PASS }}
          MM_HOOK_SECRET: ${{ secrets.MM_HOOK_SECRET }}
          MM_SIGNING_SECRET: ${{ secrets.MM_SIGNING_SECRET }}
          SMS_PROVIDER: ${{ secrets.SMS_PROVIDER }}
          TEXTO_API_KEY: ${{ secrets.TEXTO_API_KEY }}
          TEXTO_WEBHOOK_SECRET: ${{ secrets.TEXTO_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

  # The test copy (docs/STAGING.md): the `staging` branch deploys to its own Worker, database and website,
  # never the live ones. Only the Cloudflare token and the owner's sign-in are given to it: no SMS, email
  # or payment keys, so staging can't text, email or charge anyone.
  deploy-staging:
    needs: check
    if: github.ref == 'refs/heads/staging' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          npm install -g corepack@latest
          corepack enable

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Deploy staging to Cloudflare
        run: bash ./scripts/deploy-staging.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEED_OWNER_EMAIL: ${{ secrets.SEED_OWNER_EMAIL }}
          SEED_OWNER_PASSCODE: ${{ secrets.SEED_OWNER_PASSCODE }}
          SUPER_ADMINS: ${{ secrets.SEED_OWNER_EMAIL }}
