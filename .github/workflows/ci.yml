# Runs on every push: the full suite must be green before anything else (docs/12).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only used to commit the lockfile on the very first run

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Caching needs pnpm-lock.yaml; switch it on once CI has committed the lockfile.
          package-manager-cache: false

      # There's no Node on the dev machine, so the lockfile is created here once and committed back.
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi

      - name: Commit the new lockfile
        if: ${{ hashFiles('pnpm-lock.yaml') != '' && github.event_name == 'push' }}
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Add pnpm lockfile (generated by CI)"
            git push
          fi

      - name: No couple-specific content in app code (docs/13)
        run: |
          if grep -rInE 'Sophie|Nicholas|Glenworth|horse' apps/*/src packages/*/src; then
            echo "::error::Couple-specific text found in app code. Move it to seed/ or tenant content."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
