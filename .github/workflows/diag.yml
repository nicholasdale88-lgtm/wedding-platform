# Read-only diagnosis on the live database (no writes): push a branch named diag/<anything>. Prints only
# categories, statuses and flags, never names, emails or numbers. Nothing is deployed.
name: Diagnose

on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  booked:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          npm install -g corepack@latest
          corepack enable
      - name: Install
        run: pnpm install --no-frozen-lockfile --filter api...
      - name: How the owner's wedding records its suppliers (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_ACC" ]; then export CLOUDFLARE_ACCOUNT_ID="$CF_ACC"; fi
          cd apps/api
          if ! pnpm exec wrangler d1 execute wedding-db --remote --json --command "SELECT d.kind, d.scope, d.version, d.updated_at, d.data FROM planner_doc d JOIN wedding w ON w.id = d.wedding_id WHERE w.slug = 'sophie-and-nicholas' AND d.kind IN ('vendors','budget','checklist','ceremony','party') ORDER BY d.kind" > "$RUNNER_TEMP/docs.json" 2> "$RUNNER_TEMP/err.txt"; then
            echo "::error title=wrangler::$(tail -c 600 "$RUNNER_TEMP/err.txt" | tr '
' ' ')"; exit 1
          fi
          node ../../scripts/diag/booked.mjs < "$RUNNER_TEMP/docs.json"
