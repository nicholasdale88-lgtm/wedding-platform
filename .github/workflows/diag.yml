# Read-only diagnosis on the live database (no writes): push a branch named diag/<anything>. Prints only
# categories, statuses and flags, never names, emails or numbers. Nothing is deployed.
name: Diagnose

on:
  push:
    branches: ['diag/**']

permissions:
  contents: write

jobs:
  booked:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          npm install -g corepack@latest
          corepack enable
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: How the owner's wedding records its suppliers (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_ACC" ]; then export CLOUDFLARE_ACCOUNT_ID="$CF_ACC"; fi
          OUT="$GITHUB_WORKSPACE/diag-out.txt"
          cd apps/api
          set +e
          pnpm exec wrangler d1 execute wedding-db --remote --json --command "SELECT d.kind, d.scope, d.version, d.updated_at, d.data FROM planner_doc d JOIN wedding w ON w.id = d.wedding_id WHERE w.slug = 'sophie-and-nicholas' AND d.kind IN ('vendors','budget','checklist','ceremony','party') ORDER BY d.kind" > "$RUNNER_TEMP/docs.json" 2> "$RUNNER_TEMP/err.txt"
          CODE=$?
          echo "wrangler exit $CODE" > "$OUT"
          if [ "$CODE" != 0 ]; then head -c 500 "$RUNNER_TEMP/docs.json" | tr -s '[:space:]' ' ' >> "$OUT"; echo >> "$OUT"; echo "account id given: $([ -n "$CF_ACC" ] && echo yes || echo no)" >> "$OUT"; fi
          grep -iE "error|not found|auth|permission" "$RUNNER_TEMP/err.txt" | grep -viE "sophie|@" | head -5 >> "$OUT"
          node ../../scripts/diag/booked.mjs < "$RUNNER_TEMP/docs.json" >> "$OUT" 2>&1
          echo "node exit $?" >> "$OUT"
      - name: Commit the summary (flags only) back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diag-out.txt
          git commit -m "Diagnosis (CI)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
